# =============================================================================
# supervisord.conf — Process manager for Nginx + Gunicorn + Next.js
# =============================================================================
# supervisord is PID 1 inside the container and manages three long-running
# processes. If any of them exits unexpectedly, supervisord restarts it.
# All output is directed to /dev/stdout and /dev/stderr so Render captures logs.
# =============================================================================

[supervisord]
nodaemon=true                    ; run supervisord in the foreground (required for PID 1)
logfile=/dev/null                ; supervisord's own log → stdout already via nodaemon
logfile_maxbytes=0
loglevel=info
user=root

# ── Gunicorn (Django) ─────────────────────────────────────────────────────────
[program:gunicorn]
directory=/app/backend
command=gunicorn config.wsgi:application
    --bind 127.0.0.1:8000
    --workers 1
    --threads 4
    --worker-class gthread
    --timeout 120
    --access-logfile -
    --error-logfile -
    --log-level info
autostart=true
autorestart=true
startretries=100
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="config.settings"

# ── Next.js (standalone server.js) ───────────────────────────────────────────
# `next build` with output:'standalone' writes a self-contained server.js.
# We set PORT=3000 so it doesn't conflict with Nginx on 80.
[program:nextjs]
directory=/app/frontend
command=node --max-old-space-size=192 server.js
autostart=true
autorestart=true
startretries=100
priority=10
environment=PORT="3000",NODE_ENV="production",HOSTNAME="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=100
priority=20                      ; start after Gunicorn and Next.js
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
