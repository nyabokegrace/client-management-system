# =============================================================================
# nginx.conf — Reverse proxy for Django + Next.js in a single container
# =============================================================================
# Traffic routing:
#   /api/*        → Gunicorn / Django  (127.0.0.1:8000)
#   /admin/*      → Gunicorn / Django  (127.0.0.1:8000)
#   /api/schema/* → Gunicorn / Django  (127.0.0.1:8000)
#   /api/docs/*   → Gunicorn / Django  (127.0.0.1:8000)
#   /static/*     → Django staticfiles on disk
#   everything else → Next.js           (127.0.0.1:3000)
# =============================================================================

user  www-data;
# One worker per CPU core; 'auto' lets Nginx detect at runtime
worker_processes  auto;

error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log → stdout so Render captures it
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout main;

    sendfile            on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain text/css application/json
                        application/javascript text/xml application/xml
                        application/xml+rss text/javascript;

    # Allow larger uploads (e.g. document attachments)
    client_max_body_size 30M;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream django {
        server 127.0.0.1:8000;
    }

    upstream nextjs {
        server 127.0.0.1:3000;
    }

    # ── Main server block ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;   # catch-all; Render routes via its own load balancer

        # ── Common proxy headers (applied via a snippet) ──────────────────────
        # These are duplicated in each location block for clarity
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Django static files served directly from disk ─────────────────────
        location /static/ {
            alias /app/backend/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Django REST Framework & Admin API endpoints ───────────────────────
        location /api/ {
            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # drf-spectacular schema & docs endpoints
        location /api/schema/ {
            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/docs/ {
            proxy_pass         http://django;
            proxy_redirect     off;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Everything else → Next.js ─────────────────────────────────────────
        location / {
            proxy_pass         http://nextjs;
            proxy_redirect     off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket / HMR support (useful in dev; harmless in prod)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
